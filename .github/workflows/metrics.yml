name: profile-metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # еженедельно по понедельникам (UTC)

permissions:
  contents: write  # нужно, чтобы коммитить файл

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Yarklim
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          filename: assets/metrics.svg   # <— генерируем сразу в нужную папку

      - name: Debug - show files
        run: ls -la && ls -la assets

      - name: Commit metrics
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/metrics.svg"
          message: "chore: update profile metrics"
          default_author: github_actions
